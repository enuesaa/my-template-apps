version: 2

updates:
  - package-ecosystem: npm
    directory: /nextjs
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /svelte
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - '*'
