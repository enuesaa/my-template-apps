name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-linux-musl
            runs-on: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            crystallang/crystal:latest-alpine \
            crystal build --release --static tmpls.cr

      - if: runner.os == 'macOS'
        uses: crystal-lang/install-crystal@v1
      - if: runner.os == 'macOS'
        run: crystal build --release tmpls.cr

      - run: tar -czf tmpls-${{ github.ref_name }}-${{ matrix.target }}.tar.gz tmpls
      - uses: actions/upload-artifact@v4
        with:
          name: tmpls-${{ matrix.target }}
          path: tmpls-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: git archive --format=zip -o dist/templates.zip HEAD

      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
